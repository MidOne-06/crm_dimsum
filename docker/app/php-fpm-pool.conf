; Se carga después de la config por defecto del pool [www] (php-fpm.d/*.conf se
; incluye en orden alfabético, y este archivo empieza con "zz-" a propósito).
; El límite por defecto (pm.max_children=5) se agota rápido con Livewire: cada
; pestaña abierta en una página con polling/reconexión genera una petición
; recurrente que ocupa un worker completo mientras dura -- con solo 5, un par de
; pestañas activas bastan para bloquear la carga de páginas nuevas.
[www]
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
