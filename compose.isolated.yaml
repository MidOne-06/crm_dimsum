services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - isolated

  app:
    build:
      context: .
      target: application
    image: ${COMPOSE_PROJECT_NAME:-crm-dimsum-isolated}:local
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env.development}
    environment:
      DB_HOST: db
      DB_PORT: 5432
      PG_HOST: db
      PG_PORT: 5432
      NODE_EXECUTABLE: node
      RUN_MIGRATIONS: "true"
      # El gateway Restaurant queda intencionalmente inaccesible en entornos aislados.
      STOCK_GATEWAY_URL: http://127.0.0.1:9
      VENTAS_PAYLOAD_ALLOW_LOCAL_ARCHIVE: "false"
      ISOLATED_ENVIRONMENT: "true"
    volumes:
      - app_storage:/var/www/html/storage
      - public_assets:/var/www/html/public
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit((extension_loaded(\"pdo_pgsql\") && file_exists(\"public/index.php\")) ? 0 : 1);'"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - isolated

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT}:80"
    volumes:
      - public_assets:/var/www/html/public:ro
      - app_storage:/var/www/html/storage:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - isolated

volumes:
  postgres_data:
  app_storage:
  public_assets:

networks:
  isolated:
    driver: bridge
