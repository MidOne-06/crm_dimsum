name: opm-digemid

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env.docker.local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  app:
    build:
      context: .
      target: application
    image: opm-digemid:local
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env.docker.local}
    environment:
      DB_HOST: db
      DB_PORT: 5432
      PG_HOST: db
      PG_PORT: 5432
      NODE_EXECUTABLE: node
      RUN_MIGRATIONS: "true"
    volumes:
      - app_storage:/var/www/html/storage
      - public_assets:/var/www/html/public
      - ${OPM_CATALOG_HOST_PATH:-./data/catalogo}:/data/catalogo
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit((extension_loaded(\"pdo_pgsql\") && file_exists(\"public/index.php\")) ? 0 : 1);'"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - public_assets:/var/www/html/public:ro
      - app_storage:/var/www/html/storage:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - backend

  worker:
    image: opm-digemid:local
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env.docker.local}
    environment:
      DB_HOST: db
      DB_PORT: 5432
      PG_HOST: db
      PG_PORT: 5432
      NODE_EXECUTABLE: node
      RUN_MIGRATIONS: "false"
      RUN_AS_WWW_DATA: "true"
      DB_QUEUE_RETRY_AFTER: "780"
    # Kardex usa reportes XLSX completos; concede margen al timeout de 600 s
    # del job y mantenlo por debajo del retry_after de la cola.
    command: ["php", "-d", "memory_limit=512M", "artisan", "queue:work", "--queue=ventas-pages,ventas-details,default", "--sleep=1", "--tries=4", "--timeout=720", "--max-time=3600"]
    deploy:
      replicas: ${VENTAS_WORKER_REPLICAS:-20}
    volumes:
      - app_storage:/var/www/html/storage
      - ${OPM_CATALOG_HOST_PATH:-./data/catalogo}:/data/catalogo:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_healthy
    networks:
      - backend

  scheduler:
    image: opm-digemid:local
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env.docker.local}
    environment:
      DB_HOST: db
      DB_PORT: 5432
      PG_HOST: db
      PG_PORT: 5432
      RUN_MIGRATIONS: "false"
      RUN_AS_WWW_DATA: "true"
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - app_storage:/var/www/html/storage
      - ${OPM_CATALOG_HOST_PATH:-./data/catalogo}:/data/catalogo
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_healthy
    networks:
      - backend

volumes:
  postgres_data:
  app_storage:
  public_assets:

networks:
  backend:
    driver: bridge
