name: crm-dimsum

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env.docker}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  # Gateway que mantiene la sesión con Restaurant.pe y expone las APIs de
  # requerimientos. Vive en la misma red Docker para no depender del puerto
  # 3000 del host Windows (que puede no estar levantado tras un reinicio).
  gateway:
    build:
      context: ${STOCK_GATEWAY_PATH:-../../API-TI}
    image: crm-dimsum-gateway:local
    restart: unless-stopped
    # Igual que `scheduler`: server.js corre como PID 1 sin reaparentar
    # procesos hijos -- las sesiones de Playwright (chrome-headless) que se
    # cierran quedan como zombies sin cosechar. Encontrado el 2026-09-03
    # tras varias corridas de guías internas que se quedaban colgadas horas
    # sin avance (job "RUNNING" sin nunca llegar a "DONE", pese a que los
    # timeouts HTTP del cliente están configurados) -- no se pudo confirmar
    # con certeza que los zombies fueran la causa exacta, pero es la misma
    # clase de problema ya visto y corregido acá, así que se aplica el mismo
    # fix por las dudas.
    init: true
    env_file:
      - ${STOCK_GATEWAY_PATH:-../../API-TI}/.env
    networks:
      - backend

  app:
    build:
      context: .
      target: application
    image: crm-dimsum:local
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env.docker}
    environment:
      DB_HOST: db
      DB_PORT: 5432
      PG_HOST: db
      PG_PORT: 5432
      NODE_EXECUTABLE: node
      RUN_MIGRATIONS: "true"
      STOCK_GATEWAY_URL: http://gateway:3000
    volumes:
      - app_storage:/var/www/html/storage
      - public_assets:/var/www/html/public
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      gateway:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit((extension_loaded(\"pdo_pgsql\") && file_exists(\"public/index.php\")) ? 0 : 1);'"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - public_assets:/var/www/html/public:ro
      - app_storage:/var/www/html/storage:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - backend

  worker:
    image: crm-dimsum:local
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env.docker}
    environment:
      DB_HOST: db
      DB_PORT: 5432
      PG_HOST: db
      PG_PORT: 5432
      NODE_EXECUTABLE: node
      RUN_MIGRATIONS: "false"
      RUN_AS_WWW_DATA: "true"
      # 3600, no 780 (hallazgo real 2026-09-13, barrida de lógica de cálculo
      # de jobs): DB_QUEUE_RETRY_AFTER es el techo del driver 'database' para
      # volver a ofrecer un job reservado a OTRO worker -- y a diferencia de
      # un timeout de proceso, Laravel nunca renueva `reserved_at` mientras
      # el job sigue corriendo (confirmado en
      # vendor/laravel/framework/.../DatabaseQueue.php::isReservedButExpired,
      # que compara `reserved_at` contra `now() - retryAfter` sin importar si
      # el worker original sigue vivo). Con --timeout=3300 más abajo (subido
      # el 2026-09-08, ver ese comentario) pero retry_after en 780s, CUALQUIER
      # job de este worker que corriera entre 13 y 55 minutos -- exactamente
      # el escenario real que motivó subir el timeout -- quedaba abierto a
      # que una de las 5 réplicas lo tomara de nuevo mientras la réplica
      # original todavía lo procesaba: dos ejecuciones concurrentes del mismo
      # job, en la misma cola que corre `ConfirmarCanjeMasivoJob` (movimientos
      # reales e irreversibles en Restaurant). La mayoría de los jobs de esta
      # cola ya tienen su propio `Cache::lock` como mitigación (ver
      # ConfirmarCanjeMasivoJob, SincronizarGuiasInternasJob, etc.), pero
      # `SincronizarStockActualJob` no lo tenía -- este fix cierra la causa
      # raíz para los 6 jobs de la cola a la vez, dejando los locks existentes
      # como defensa en profundidad, no como el único mecanismo real.
      DB_QUEUE_RETRY_AFTER: "3600"
      STOCK_GATEWAY_URL: http://gateway:3000
    # Kardex usa reportes XLSX completos; concede margen al timeout de 600 s
    # del job y mantenlo por debajo del retry_after de la cola.
    # guias-internas/salidas-stock/requerimientos-stock se agregaron para
    # que un redeploy de `scheduler` (donde antes corrían via
    # BackgroundArtisan) no interrumpa una sincronización histórica larga a
    # mitad de camino -- ver Bitácora en AGENTS.md.
    #
    # --timeout=720 (encontrado el 2026-09-03, causa raíz real de los
    # "stalls" de horas en guías internas #71/#80/#82): SincronizarGuiasInternasJob,
    # SincronizarSalidasStockJob y SincronizarRequerimientosStockJob procesan
    # TODAS las páginas de una corrida dentro de un solo handle() -- el
    # $timeout=7200 de la clase Job es la intención real, pero el --timeout
    # de la CLI de queue:work es el que Laravel realmente hace cumplir (con
    # SIGKILL, vía un proceso hijo) y gana el valor más chico. Con
    # --timeout=720 (12 min), una sola página lenta (muchos detalles, sesión
    # de Restaurant.pe contendida) superaba ese límite y el worker mataba el
    # proceso a la fuerza -- un SIGKILL no dispara el `finally` que libera el
    # Cache::lock, así que quedaba huérfano hasta por 4h (su propio TTL) sin
    # que nada lo notara aparte del aviso de "sin avance" en la UI. Subido a
    # 3300s (55 min, justo debajo de --max-time) para dar margen real a una
    # página lenta sin dejar de tener un techo ante un hang genuino.
    # Las ventas históricas se atienden en `sales-worker`, aisladas de los
    # flujos que alimentan la Directiva. Así una extracción masiva no compite
    # por workers con kardex, guías, salidas, requerimientos ni stock actual.
    command: ["php", "-d", "memory_limit=512M", "artisan", "queue:work", "--queue=stock-actual,guias-internas,salidas-stock,requerimientos-stock,movimientos-almacenes,default", "--sleep=1", "--tries=4", "--timeout=3300", "--max-time=3600"]
    deploy:
      replicas: ${VENTAS_WORKER_REPLICAS:-0}
    volumes:
      - app_storage:/var/www/html/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_healthy
      gateway:
        condition: service_started
    networks:
      - backend

  # Pool exclusivo para la extracción de ventas. Cada worker procesa una
  # solicitud de detalle por vez y el gateway limita las solicitudes a las
  # sesiones Restaurant disponibles. Mantener este pool separado evita que la
  # aceleración histórica afecte el kardex o las operaciones logísticas.
  sales-worker:
    image: crm-dimsum:local
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env.docker}
    environment:
      DB_HOST: db
      DB_PORT: 5432
      PG_HOST: db
      PG_PORT: 5432
      NODE_EXECUTABLE: node
      RUN_MIGRATIONS: "false"
      RUN_AS_WWW_DATA: "true"
      DB_QUEUE_RETRY_AFTER: "780"
      STOCK_GATEWAY_URL: http://gateway:3000
    command: ["php", "-d", "memory_limit=512M", "artisan", "queue:work", "--queue=ventas-pages,ventas-details", "--sleep=1", "--tries=4", "--timeout=720", "--max-time=3600"]
    deploy:
      replicas: ${VENTAS_BACKFILL_WORKER_REPLICAS:-0}
    volumes:
      - app_storage:/var/www/html/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_healthy
      gateway:
        condition: service_started
    networks:
      - backend

  # Kardex no comparte workers con ventas: el gateway de Restaurant conserva
  # una sesión de navegador y debe recibir una descarga a la vez. Mantener una
  # sola réplica hace el proceso estable para los 37 locales.
  kardex-worker:
    image: crm-dimsum:local
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env.docker}
    environment:
      DB_HOST: db
      DB_PORT: 5432
      PG_HOST: db
      PG_PORT: 5432
      NODE_EXECUTABLE: node
      RUN_MIGRATIONS: "false"
      RUN_AS_WWW_DATA: "true"
      DB_QUEUE_RETRY_AFTER: "780"
      STOCK_GATEWAY_URL: http://gateway:3000
    command: ["php", "-d", "memory_limit=512M", "artisan", "queue:work", "--queue=kardex", "--sleep=1", "--tries=3", "--timeout=720", "--max-time=3600"]
    volumes:
      - app_storage:/var/www/html/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_healthy
      gateway:
        condition: service_started
    networks:
      - backend

  scheduler:
    image: crm-dimsum:local
    restart: unless-stopped
    # schedule:work corre como PID 1 y lanza en segundo plano (vía `&`) cada
    # comando programado que necesita seguir vivo tras la respuesta -- pero
    # PID 1 no hereda el manejo estándar de SIGCHLD de un init real, así que
    # esos hijos, al morir (normalmente o por un `docker restart`), quedan
    # zombies (estado Z) para siempre en vez de limpiarse. Con muchos, esto
    # ensucia la tabla de procesos y, peor, deja registros de sincronización
    # marcados "en_progreso" indefinidamente porque el PID que se guardó ya
    # no corresponde a nada real. `init: true` inserta tini como PID 1
    # real, que sí reaparienta y limpia (reap) esos procesos.
    init: true
    env_file:
      - ${ENV_FILE:-.env.docker}
    environment:
      DB_HOST: db
      DB_PORT: 5432
      PG_HOST: db
      PG_PORT: 5432
      RUN_MIGRATIONS: "false"
      RUN_AS_WWW_DATA: "true"
      STOCK_GATEWAY_URL: http://gateway:3000
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_healthy
      gateway:
        condition: service_started
    networks:
      - backend

volumes:
  # Se conservan los volúmenes existentes para no perder los datos locales,
  # aunque el proyecto Docker ahora se identifique como crm-dimsum.
  postgres_data:
    external: true
    name: ${POSTGRES_VOLUME_NAME:-crm-dimsum_postgres_data}
  app_storage:
    external: true
    name: ${APP_STORAGE_VOLUME_NAME:-crm-dimsum_app_storage}
  public_assets:
    external: true
    name: ${PUBLIC_ASSETS_VOLUME_NAME:-crm-dimsum_public_assets}

networks:
  backend:
    driver: bridge
