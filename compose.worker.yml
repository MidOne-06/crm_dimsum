# Despliegue liviano para correr SOLO la extracción de Kardex/Ventas en una
# máquina separada del panel web -- sin app/web/db (la BD ya vive en el VPS,
# apuntada por DB_URL en .env.worker; no se levanta un Postgres local aquí).
#
# Layout esperado en el servidor (dos repos clonados como hermanos):
#   crm-dimsum/
#     opm-digemid/   <- github.com/MidOne-06/crm_dimsum (este compose vive aquí)
#     api-ti/        <- github.com/MidOne-06/api-ti
#
# Uso:
#   cd crm-dimsum/opm-digemid
#   docker compose -f compose.worker.yml up -d --build
name: crm-dimsum-worker

services:
  gateway:
    build:
      context: ../api-ti
    image: crm-dimsum-gateway:local
    restart: unless-stopped
    env_file:
      - ../api-ti/.env
    ports:
      - "3000:3000"
    networks:
      - backend

  worker:
    build:
      context: .
      target: application
    image: opm-digemid:local
    restart: unless-stopped
    env_file:
      - .env.worker
    environment:
      RUN_MIGRATIONS: "false"
      RUN_AS_WWW_DATA: "true"
      DB_QUEUE_RETRY_AFTER: "780"
      # Nombre de servicio Docker, no host.docker.internal -- el gateway vive
      # en este mismo compose/red, no en el host.
      STOCK_GATEWAY_URL: http://gateway:3000
    # Kardex usa reportes XLSX completos; concede margen al timeout de 720s
    # del job y mantenlo por debajo del retry_after de la cola (780s).
    command: ["php", "-d", "memory_limit=512M", "artisan", "queue:work", "--queue=ventas-pages,ventas-details,default", "--sleep=1", "--tries=4", "--timeout=720", "--max-time=3600"]
    deploy:
      replicas: ${WORKER_REPLICAS:-6}
    depends_on:
      - gateway
    networks:
      - backend

  scheduler:
    image: opm-digemid:local
    restart: unless-stopped
    env_file:
      - .env.worker
    environment:
      RUN_MIGRATIONS: "false"
      RUN_AS_WWW_DATA: "true"
      STOCK_GATEWAY_URL: http://gateway:3000
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      - gateway
      - worker
    networks:
      - backend

networks:
  backend:
    driver: bridge
